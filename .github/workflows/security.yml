name: security-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast-and-dependencies:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip bandit pip-audit
      - run: python -m pip install -r requirements.txt
      - name: Scan application code
        run: bandit -r config incidents -ll
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dynamic-security-lab:
    name: Dynamic SQL injection hardening gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Exercise dynamic attack payloads in an isolated SQLite lab
        run: python manage.py test training.tests.test_hardening --settings=config.settings.security_lab

  zap-baseline:
    name: Scoped ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput --settings=config.settings.test
      - name: Start disposable local application
        run: python manage.py runserver 127.0.0.1:8000 --noreload --settings=config.settings.test > server.log 2>&1 &
      - name: Wait for local server
        run: |
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8000/ && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Baseline scan only the disposable local URL
        run: docker run --network host --rm -v "$PWD:/zap/wrk/:rw" zaproxy/zap-stable zap-baseline.py -t http://127.0.0.1:8000/ -r zap-baseline-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html
